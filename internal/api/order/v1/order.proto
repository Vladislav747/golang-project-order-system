syntax = "proto3";

package order.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Vladislav747/golang-project-order-system/internal/pkg/api/order/v1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc GetOrders(GetOrdersRequest) returns (GetOrdersResponse);
  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
  rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse);
}

message Order {
  string id = 1;
  string customer_id = 2;
  string status = 3;
  int64 total_amount = 4;
  string currency = 5;
  bytes items = 6; // JSON
  google.protobuf.Timestamp created_at = 7; // RFC3339
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp deleted_at = 9; // empty if not deleted
}

message CreateOrderRequest {
  string id = 1; // optional; empty => server generates
  string customer_id = 2;
  string status = 3;
  int64 total_amount = 4;
  string currency = 5;
  bytes items = 6;
}

message CreateOrderResponse {
  string id = 1;
  bool async = 2; // true => accepted to kafka queue
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message GetOrdersRequest {}

message GetOrdersResponse {
  repeated Order orders = 1;
}

message UpdateOrderRequest {
  string id = 1;
  string customer_id = 2;
  string status = 3;
  int64 total_amount = 4;
  string currency = 5;
  bytes items = 6;
}

message UpdateOrderResponse {
  bool async = 1;
}

message DeleteOrderRequest {
  string id = 1;
  bool hard = 2; // true => hard delete, false => soft
}

message DeleteOrderResponse {
  bool async = 1;
}
