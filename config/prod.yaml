env: "prod" #local, stg, prod
processing_mode:
  mode: "async" # sync, async
http_server:
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s
  graceful_shutdown_timeout: 10s
  request_timeout: 10s
outbox:
  relay_interval: 2s
  limit: 100
  # как часто cleaner удаляет опубликованные сообщения старше published_retention
  cleanup_interval: 1h
  # через сколько будет удаляться опубликованное сообщение
  published_retention: 24h
  # максимальное количество попыток опубликования сообщения
  max_attempts: 3
  # задержка перед повторной публикацией: 1s → 2s → 4s …
  backoff_initial: 1s
  # потолок задержки
  backoff_max: 8s
dlq:
  topic: orders.dlq
  # сколько раз consumer повторяет обработку одного сообщения до DLQ
  consumer_max_retries: 3
  # пауза между повторами
  consumer_retry_backoff: 200ms
